spring:
    application:
        name: qoap-quiz-service
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/qoap_quiz
        username: admin
        password: admin
    jpa:
        hibernate:
            ddl-auto: create
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    sql:
        init:
            mode: always
