platform:
  security:
    cors:
      enabled: true
      allowed-origin-patterns:
        - http://localhost:5173

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: qoap-identity-service
              uri: lb://qoap-identity-service
              predicates:
                - Path=/identity/**

            - id: qoap-quiz-service
              uri: lb://qoap-quiz-service
              predicates:
                - Path=/quiz/**
